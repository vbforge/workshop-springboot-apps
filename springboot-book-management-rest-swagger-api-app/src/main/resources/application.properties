# =================================
# Application Configuration
# =================================
spring.application.name=springboot-book-management-rest-swagger-api-app
server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =================================
# Database Configuration - MySQL
# =================================
spring.datasource.url=jdbc:mysql://localhost:3306/book_management_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =================================
# JPA / Hibernate Configuration
# =================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# =================================
# Logging Configuration
# =================================
logging.level.root=INFO
logging.level.com.vbforge.bookapi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =================================
# Swagger/OpenAPI Configuration
# =================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=false

# =================================
# Jackson Configuration (JSON)
# =================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC