version: '3.9'

# JUNIOR NOTE — Docker networking:
# Services in the same docker-compose file share a private network automatically.
# The service NAME becomes a DNS hostname inside that network.
# So "ollama" in application.yml (http://ollama:11434) resolves to the ollama container.
# Your laptop's browser accesses the app via localhost:8080 (mapped port).

services:

  # ── Spring Boot Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ras-app
    ports:
      # host:container — browser visits localhost:8080, Docker routes to container's 8080
      - "8080:8080"
    environment:
      # Override the Ollama URL for Docker networking
      # "ollama" resolves to the ollama service container on the internal network
      RAS_OLLAMA_BASE-URL: http://ollama:11434
    depends_on:
      ollama:
        # Wait for Ollama to be healthy before starting the app
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ras-network

  # ── Ollama Local AI ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ras-ollama
    ports:
      # Optional: expose Ollama on localhost so you can test it directly from browser
      # curl http://localhost:11434/api/tags
      - "11434:11434"
    volumes:
      # CRITICAL: persist downloaded models between container restarts.
      # Without this volume, you'd re-download the model every time. ~2GB each time!
      - ollama-data:/root/.ollama
    healthcheck:
      # Ollama exposes a simple HTTP endpoint — if it responds, it's ready
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ras-network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  # Named volume — Docker manages the storage location on your host.
  # Data persists even if you stop/remove containers.
  # docker volume ls — to see it
  # docker volume rm ras-simulator_ollama-data — to wipe downloaded models
  ollama-data:

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  ras-network:
    driver: bridge
